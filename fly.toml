# The realtime server. Used a handful of times a year, so it sleeps between
# sessions and wakes on demand — a stopped machine costs nothing.
#
# If it is asleep, down, or never deployed, the Netlify site still works
# completely: solo mode needs no server at all.

app = "soup-readingsoup"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # SINGLE MACHINE ONLY. Room state is in memory and there is exactly one room,
  # so a second machine would split participants across two different rooms at
  # random — some people in the lobby the projector can see, some in a room
  # nobody is running. Fly's first deploy creates a second machine for high
  # availability by default; deploys must pass --ha=false, and the workflow does.
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
